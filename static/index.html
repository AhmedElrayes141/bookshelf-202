<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رف الكتب | bookshelf_202</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="#" class="logo">
        <img src="logo.png" alt="شعار رف الكتب" class="brand-logo-img">
    </a>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ابحث باسم الكتاب أو المؤلف...">
    </div>
    <button class="cart-btn" onclick="openCart()">
        🛒 السلة (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <h1>رف الكتب</h1>
    <p>نختار لك ما يستحق وقتك، لا ما تملأ به رفوفك.</p>
</section>

<div class="categories" id="categoryButtons">
    <button class="cat-btn active" data-cat="رعب">رعب</button>
    <button class="cat-btn" data-cat="رومانسية">رومانسية</button>
    <button class="cat-btn" data-cat="مغامرة">مغامرة</button>
    <button class="cat-btn" data-cat="دينية">قرآن وكتب دينية</button>
    <button class="cat-btn" data-cat="غموض وجريمة">غموض وجريمة</button>
    <button class="cat-btn" data-cat="علم نفس وتنمية">علم نفس وتنمية بشرية</button>
</div>

<main class="container">
    <div class="books-grid" id="booksGrid"></div>
</main>

<!-- نافذة تفاصيل الكتاب -->
<div class="overlay" id="detailsModal">
    <div class="modal">
        <button class="close-btn" onclick="closeModal('detailsModal')">×</button>
        <div id="detailsContent"></div>
    </div>
</div>


<!-- نافذة سلة المشتريات -->
<div class="overlay" id="cartModal">
    <div class="modal" style="max-height: 90vh; overflow-y: auto;">
        <button class="close-btn" onclick="closeModal('cartModal')">×</button>
        <h2 style="margin-bottom:15px; color:var(--primary-dark);">🛒 سلة المشتريات</h2>
        <div id="cartItems"></div>

        <!-- بيانات التوصيل وطريقة الدفع -->
        <div style="margin-top:15px; display:flex; flex-direction:column; gap:10px; border-top:1px solid #eee; padding-top:15px;">
            <input type="text" id="custName" placeholder="الاسم بالكامل *"
                   style="padding:10px; border:1px solid #ccc; border-radius:8px; font-family:inherit;">
            <input type="tel" id="custPhone" placeholder="رقم الموبايل / واتساب *"
                   style="padding:10px; border:1px solid #ccc; border-radius:8px; font-family:inherit; direction:rtl;">
            <input type="text" id="custAddress" placeholder="العنوان بالتفصيل (المحافظة - المدينة - الشارع) *"
                   style="padding:10px; border:1px solid #ccc; border-radius:8px; font-family:inherit;">

            <label style="font-weight:700; font-size:0.9rem; color:var(--primary-dark); margin-top:4px;">💳 اختر طريقة الدفع:</label>
            <select id="paymentMethod" onchange="handlePaymentChange()"
                    style="padding:10px; border:1px solid #ccc; border-radius:8px; font-family:inherit; background:#fff;">
                <option value="الدفع عند الاستلام">💵 الدفع عند الاستلام (كاش)</option>
                <option value="فودافون كاش">📱 فودافون كاش (Vodafone Cash)</option>
                <option value="إنستاباي">🏦 إنستاباي (InstaPay)</option>
            </select>

            <!-- صندوق تفاصيل الدفع الأونلاين -->
            <div id="onlinePaymentBox" style="display:none; background:#f9f6f0; border:1.5px solid #d4af37; border-radius:10px; padding:12px;">
                <p id="paymentInstructionTitle" style="font-weight:700; color:#1e3a3d; margin-bottom:6px; font-size:0.92rem;"></p>
                <div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:8px 12px; border-radius:8px; border:1px dashed #1e3a3d; margin-bottom:10px;">
                    <strong id="paymentAccountDisplay" dir="ltr" style="font-size:1rem; color:#14282a;"></strong>
                    <button type="button" onclick="copyPaymentAccount()" style="background:#1e3a3d; color:#f2cd98; border:none; padding:5px 12px; border-radius:6px; cursor:pointer; font-family:inherit; font-size:0.82rem; font-weight:700;">
                        نسخ 📋
                    </button>
                </div>
                <input type="text" id="paymentReference" placeholder="اكتب الرقم أو اسم الحساب المحوّل منه للتأكيد *"
                       style="width:100%; padding:9px; border:1px solid #ccc; border-radius:8px; font-family:inherit; font-size:0.9rem;">
            </div>
        </div>

        <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
            <strong>الإجمالي: <span id="cartTotal" style="color:var(--primary); font-size:1.3rem;">0</span> ج.م</strong>
            <button class="btn-add" style="padding:10px 20px; font-size:1rem;" onclick="checkout()">إتمام الطلب</button>
        </div>
    </div>
</div>

<footer>
    <div id="footerAddressBox" style="margin-bottom: 10px; font-size: 0.92rem; color: #f2cd98;">
        📍 <span id="storeAddressText">مصر - متاح التوصيل لجميع المحافظات</span>
    </div>
    <div class="footer-social">

    </div>
</footer>
